<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nhận dạng chữ số viết tay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <h1>Nhận dạng chữ số viết tay</h1>
      <p>Nhận diện các con số từ 0–9 từ hình ảnh viết tay của người dùng.</p>
    </header>

    <section class="workspace">
      <article class="card input-card">
        <div class="card-header">
          <div class="heading-group">
            <span class="icon-box pen-icon" aria-hidden="true"></span>
            <div>
              <h2>Vùng nhập chữ số</h2>
              <p>Vẽ số hoặc tải ảnh chữ số của bạn vào đây</p>
            </div>
          </div>
          <label class="upload-button">
            <span class="upload-icon" aria-hidden="true">↥</span>
            Tải ảnh
            <input id="imageInput" type="file" accept="image/*">
          </label>
        </div>

        <div class="drawing-area">
          <canvas id="drawingCanvas" aria-label="Vùng vẽ chữ số"></canvas>
        </div>

        <div class="actions">
          <button id="redrawButton" class="button button-outline primary-text" type="button">
            <span class="button-icon">✎</span> Vẽ lại
          </button>
          <button id="clearButton" class="button button-outline" type="button">
            <span class="button-icon">⌫</span> Xóa
          </button>
          <button id="recognizeButton" class="button button-primary" type="button">
            <span class="button-icon">✦</span> Nhận diện
          </button>
        </div>
      </article>

      <aside class="card result-card">
        <div class="result-heading">
          <span class="icon-box chart-icon" aria-hidden="true"><i></i><i></i><i></i></span>
          <div>
            <h2>Kết quả nhận diện</h2>
            <p>Chữ số được nhận diện là</p>
          </div>
        </div>

        <div class="prediction-ring">
          <span id="predictedDigit">7</span>
        </div>

        <div class="confidence">Độ tin cậy: <strong id="confidenceValue">98.67%</strong></div>
        <div class="divider"></div>

        <div class="probability-section">
          <h3>Xác suất 0–9</h3>
          <div id="probabilityList" class="probability-list"></div>
        </div>
      </aside>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
